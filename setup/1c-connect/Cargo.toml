# Cargo refuses a package name that starts with a digit; the binary may be
# called 1c-connect, the package is onec-connect and the library one_c_connect.
[package]
name = "onec-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Подключение машины с 1С к среде разработки: туннель и мост к mcp-1c"

[lib]
name = "one_c_connect"
path = "src/lib.rs"

[[bin]]
name = "1c-connect"
path = "src/main.rs"

# Окно входит в сборку по умолчанию: двойной щелчок по файлу из комплекта
# обязан его открыть. На Linux оно тоже собирается — образ со стендом
# запускает программу в локальном режиме со значком в трее XFCE; без окна
# (`--no-default-features`) там остаётся только CLI для живого теста туннеля.
[features]
default = ["gui"]
gui = ["common/gui", "dep:gpui-kit", "dep:tray-icon", "dep:futures", "dep:image", "dep:embed-resource", "dep:raw-window-handle", "dep:gtk"]

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
gpui-kit = { version = "=0.7.3", optional = true }
tray-icon = { version = "=0.26.1", default-features = false, optional = true }
futures = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# The SSH client is embedded: ssh.exe is an optional Windows component with
# behaviour that differs by version, and it takes the password only from a
# keyboard. ring, not aws-lc-rs: no cmake/nasm needed on a Windows build box.
russh = { version = "0.64", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Трею нужен инициализированный GTK и прокрутка его цикла (`tray::init`,
# `tray::pump`). Крейт всё равно приходит с libappindicator, здесь он нужен
# по имени; на других системах его нет вовсе.
gtk = { version = "0.18", optional = true }
# Значку в трее на Linux нужен бэкенд, иначе `tray-icon` отказывается
# собираться: «either the `libappindicator` or `ksni` feature must be enabled».
# Берём libappindicator: панель XFCE показывает его элементы (проверено в
# образе живым значком), а меню у `muda` на Linux всё равно через GTK, так что
# `ksni` без GTK не обошёлся бы. На сборке нужны libgtk-3-dev и
# libayatana-appindicator3-dev, в образе — libayatana-appindicator3-1.
tray-icon = { version = "=0.26.1", default-features = false, features = ["libappindicator"], optional = true }

[target.'cfg(windows)'.dependencies]
# Ради HWND окна: GPUI реализует `HasWindowHandle`, но сам типаж наружу не
# отдаёт. Новой сборки крейт не добавляет — он уже в зависимостях gpui.
raw-window-handle = { version = "0.6", optional = true }
windows-sys ={ version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "native-tls"]

[target.'cfg(unix)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls-native-roots"]

[target.'cfg(unix)'.dependencies]
# Убийство группы процессов: SIGTERM, через 5 с SIGKILL. libc уже в Cargo.lock
# (его тянет tokio), прямая зависимость ничего не докачивает.
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
embed-resource = { version = "3", optional = true }
