# Семь шагов онбординга, из раздела «Сценарий» спецификации
# (docs/superpowers/specs/2026-10-20-onboarding-overlay-design.md).
# Тексты — согласованное содержимое продукта, здесь их не редактируют.
#
# Второй акт (жёлтая кнопка «Показать, как правки попадают в базу») в
# версию один не входит — у последнего шага только [Готово].

[[step]]
number = 1
title = "Здравствуйте"
body = """
Вы на демонстрационном стенде. Это отдельная машина, заведённая для того, \
чтобы всё тут потрогать руками: своей базе и своему рабочему компьютеру \
отсюда ничего не угрожает.

Здесь уже стоит учебная 1С с «Управлением нашей фирмой» и редактор, в \
котором живёт ИИ-агент. Ставить ничего не нужно, ломать тут нечего.

Дальше — семь коротких шагов, минуты три. Посмотрим, как агент работает \
с настоящей конфигурацией 1С.
"""
buttons = ["Начать", "Закрыть"]
advance_on = "button"
[step.target]
kind = "none"
[step.actions]
"Начать" = "next"
"Закрыть" = "close"

[[step]]
number = 2
title = "Сначала знакомое"
body = """
Это обычная 1С: учебная платформа и УНФ. База ваша собственная, пароль \
спрашивать не будет. Откройте её и заведите одну номенклатуру — любую, хоть \
«Стул». Это минута, и она понадобится на четвёртом шаге.
"""
buttons = ["Открыть 1С", "Дальше"]
# Только по кнопке (ruling финальной волны): шаг просит завести позицию
# номенклатуры, а появление окна 1С значит «человек только начал», а не
# «закончил». С advance_on="target" шаг уходил вперёд, пока человек ещё
# заводит позицию — раньше с wait_for на окно 1С, тот же баг, что без
# него: цель стрелки правильная (значок), а сигнал к переходу — нет.
advance_on = "button"
[step.target]
kind = "desktop_icon"
desktop_file = "1c-start.desktop"
[step.actions]
"Открыть 1С" = { action = "next", launch = ["1c-stand", "start1c"] }
"Дальше" = "next"

[[step]]
number = 3
title = "Теперь редактор"
body = """
Сначала закройте 1С. Учебная лицензия пускает в базу только одного, а \
следующим туда пойдёт агент: пока ваше окно открыто, он до базы не \
достучится.

Zed — редактор кода. Писать в нём ничего не придётся: он нужен как окно, в \
котором живёт агент.
"""
buttons = ["Закрыть 1С и открыть редактор", "Дальше"]
# Только по кнопке (та же находка, что и у шага 2, во второй волне):
# с advance_on="target"/wait_for на окно Zed шаг проскакивал сам, если
# Zed уже был открыт — человек не успевал нажать кнопку, которая
# закрывает 1С, и предупреждение тогда никогда не покажется (кнопку же
# не нажали). Значок Zed на столе уже со сборки образа — ждать его
# тоже бессмысленно, та же причина, что у шага 2.
advance_on = "button"
[step.target]
kind = "desktop_icon"
desktop_file = "dev.zed.Zed.desktop"
[step.actions]
# "next": кнопка теперь сама продвигает шаг (wait_for нет — ждать
# нечего). Вежливо просит 1С закрыться (close_window, не kill — человек
# только что вводил данные) и открывает редактор; если 1С не закрылась
# через несколько секунд, main.py допишет об этом в тело выноски, а не
# промолчит.
"Закрыть 1С и открыть редактор" = { action = "next", launch = ["zed"], close_window = "Управление нашей фирмой" }
"Дальше" = "next"

[[step]]
number = 4
title = "Вот агент. Спросите его о своей базе"
body = """
Справа панель, в которой он отвечает. Вот готовые вопросы, если не хочется придумывать:
"""
questions = [
    "Какая номенклатура есть в базе",
    "Покажи структуру документа «Заказ покупателя»",
    "Сколько справочников и документов в этой конфигурации",
]
buttons = ["Дальше"]
advance_on = "button"
[step.target]
kind = "window"
name_pattern = "Zed"
anchor = "right-bottom"
[step.actions]
"Дальше" = "next"

[[step]]
number = 5
title = "Это была ваша база"
body = """
Он назвал ту самую номенклатуру, которую вы только что завели. Это ваша \
база, а не выдумка. Менять в ней что-нибудь он станет только тогда, когда вы \
его об этом попросите.

1С теперь можно открыть обратно: агент базу не держит, он заходит в неё \
только на время вопроса.
"""
buttons = ["Дальше"]
advance_on = "button"
[step.target]
kind = "window"
name_pattern = "Zed"
anchor = "right-bottom"
[step.actions]
"Дальше" = "next"

[[step]]
number = 6
title = "Что связывает базу и агента"
body = """
Вот эта программа, значок внизу справа. Она выгружает конфигурацию из базы в проект, показывает её агенту и возвращает правки обратно — примерно как хранилище конфигурации, только историю видит ещё и агент, и любую правку можно отменить.

Щёлкните по значку: откроется окно, вверху переключатель обслуживания вызовов агента. Он должен быть включён — в карточке тогда «MCP включены». Пока снят, агент до базы не дотянется.

На вашей машине этот же переключатель поднимает туннель в среду разработки. И это единственное, что вам придётся поставить у себя из всего, что вы здесь видели.
"""
buttons = ["Дальше"]
advance_on = "button"
# Шаг предлагает открыть окно коннектора — значит место ему нужно
# оставить заранее, иначе окно откроется прямо под выноской (поймано
# на стенде 21.10.2026, во втором акте то же самое было закрыто раньше).
reserve = "connector"
[step.target]
kind = "tray"
[step.actions]
"Дальше" = "next"

[[step]]
number = 7
title = "Где лежит сама конфигурация"
body = """
Выгруженная конфигурация попадает сюда — в репозитории на стенде. Этот значок открывает их в браузере: видно каждую правку, кто её сделал и что именно изменилось в коде.

Агент пишет сюда так же, как человек. Поэтому любую его правку можно посмотреть до того, как она уйдёт в базу, и откатить, если она не понравилась.
"""
buttons = ["Показать, как правки попадают в базу", "Готово"]
advance_on = "button"
[step.target]
kind = "desktop_icon"
desktop_file = "gitea.desktop"
[step.actions]
"Показать, как правки попадают в базу" = "next"
"Готово" = "close"

# --- Второй акт -------------------------------------------------------
#
# Первый акт показывает, что агент умеет читать базу. Второй показывает
# круг целиком: конфигурация разложена в файлы, агент правит, правка
# возвращается в базу. Запускается по желанию, кнопкой с последнего шага
# первого акта, и считается отдельно — «Шаг 1 из 7», а не «Шаг 8 из 14».
#
# Числа в текстах — измеренные, не придуманные: выгрузка 12 минут 39
# секунд и 66 958 файлов, загрузка одного объекта 107 секунд (стенд,
# рабочее место dev2, 20.10.2026).
#
# Кнопки пока никуда не зовут. Выгрузку и загрузку делает 1c-connect, его
# линуксовая часть лежит в ветке local-mode и в main ещё не пришла.
# Показывать кнопку, которая зовёт несуществующий путь, нельзя: человек
# пойдёт повторять это у себя.

[[step]]
number = 8
act = 2
title = "Что сейчас произойдёт"
body = """
Агент работает с файлами, а конфигурация живёт внутри базы. Чтобы он её видел, конфигурацию раскладывают по файлам, а потом собирают обратно.

Разложить — долго: на этой базе вышло около двадцати двух минут и почти шестьдесят семь тысяч файлов. Делается это один раз, и на стенде уже сделано заранее — ждать вам не придётся.

Собрать обратно — быстро, около двух минут, потому что возвращается только изменённое. Это вы и пройдёте сейчас: попросите агента о правке и вернёте её в базу.
"""
buttons = ["Поехали", "В другой раз"]
advance_on = "button"
[step.target]
kind = "none"
[step.actions]
"Поехали" = "next"
"В другой раз" = "close"

[[step]]
number = 9
act = 2
title = "Файлы возит git"
body = """
Агент живёт в этом контейнере, а 1С — на вашей машине. Напрямую он до неё не дотягивается, и файлы по сети между ними не ездят.

Возит их git. Коннектор выгружает конфигурацию в файлы и отправляет их в Gitea — это «Репозитории» на рабочем столе. Оттуда вы забираете их себе.

Откройте «Репозитории», зайдите в проект и нажмите кнопку «Код» — она справа над списком файлов. В ней ссылка и кнопка «скопировать».

Дальше в терминале — его можно открыть прямо в Zed — наберите git clone, пробел, и вставьте ссылку. Пароль не спросят, вход в терминале уже настроен.

Когда скачается, откройте эту папку в Zed как проект: «File», «Open Folder».
"""
buttons = ["Дальше"]
advance_on = "button"
[step.target]
kind = "desktop_icon"
desktop_file = "gitea.desktop"
[step.actions]
"Дальше" = "next"

[[step]]
number = 10
act = 2
title = "Конфигурация в файлах"
body = """
Внутри скачанной папки есть каталог src. Это и есть конфигурация вашей базы, разложенная по файлам: каждый справочник, документ и модуль лежит отдельно.

Агент читает и правит именно эти файлы. Вы тоже можете: это обычные файлы, открываются и правятся как любые другие. Но в базе правка окажется только после загрузки — её вы сделаете чуть позже.

Если в дереве слева пока другой проект, значит папка ещё не открыта: «File», «Open Folder» и выберите скачанную.
"""
buttons = ["Дальше"]
advance_on = "button"
[step.target]
kind = "window"
name_pattern = "Zed"
anchor = "middle"
[step.actions]
"Дальше" = "next"

[[step]]
number = 11
act = 2
title = "Попросите агента поправить"
body = """
Попросите своими словами — например: переименуй синоним справочника «Номенклатура» в «Номенклатура (правка агента)».

Агент найдёт нужный файл сам. Менять он будет файл проекта, а не базу: в базе пока ничего не произойдёт.
"""
buttons = ["Дальше"]
advance_on = "button"
[step.target]
kind = "window"
name_pattern = "Zed"
anchor = "right-bottom"
[step.actions]
"Дальше" = "next"

[[step]]
number = 12
act = 2
title = "Посмотрите, что он сделал"
body = """
Щёлкните по значку коннектора в трее — откроется его окно. Вкладка «Проект» показывает состояние: какая ветка и что в ней изменилось после правки агента.

Это та же история, что видна в репозиториях на рабочем столе. Правку можно прочитать до того, как она уйдёт в базу, и отменить, если она не понравилась.
"""
buttons = ["Дальше"]
advance_on = "button"
reserve = "connector"
[step.target]
kind = "tray"
[step.actions]
"Дальше" = "next"

[[step]]
number = 13
act = 2
title = "Верните правку в базу"
body = """
В том же окне, на вкладке «Проект», кнопка «Загрузить в 1С» собирает конфигурацию обратно. Свежее из репозитория она забирает сама — тянуть руками ничего не нужно.

Возвращается только изменённое, поэтому это минуты, а не часы. Но самая первая загрузка после того, как вы склонировали папку, идёт полностью: сравнивать ещё не с чем. Она будет долгой — это не зависание.

1С в это время должна быть закрыта: учебная лицензия пускает в базу одного. Если она открыта, коннектор так и скажет и делать ничего не станет.

Пока идёт, окно показывает фазу и секундомер. Оно может уйти за другие окна — это обычное окно, а не подсказка поверх всего.
"""
buttons = ["Загрузить в 1С", "Дальше"]
advance_on = "button"
reserve = "connector"
[step.target]
kind = "tray"
[step.actions]
# Кнопка делает то же, что кнопка в окне коннектора, — зовёт его import.
# Через 1c-stand, а не напрямую: путь к коннектору живёт в одном месте.
"Загрузить в 1С" = { action = "next", launch = ["1c-stand", "import"] }
"Дальше" = "next"

[[step]]
number = 14
act = 2
title = "Откройте 1С и убедитесь"
body = """
Откройте справочник «Номенклатура». В списке он теперь называется так, как попросили у агента.

Это ваша база, а не копия: правка прошла полный круг — из базы в файлы, через агента, обратно в базу.
"""
buttons = ["Дальше"]
advance_on = "button"
[step.target]
kind = "desktop_icon"
desktop_file = "1c-start.desktop"
[step.actions]
"Дальше" = "next"

[[step]]
number = 15
act = 2
title = "А как это будет у вас"
body = """
На вашей машине нужно поставить только одну программу — ту, что в трее. Остальное у вас уже есть: 1С, база и ваш рабочий компьютер.

Настроить её — это заполнить несколько строк в её файле настроек: адрес среды разработки, ваше рабочее место и пароль к нему, путь к базе и имя пользователя базы с правами администратора. Пароль у этого пользователя может быть пустым, а имя — нет: с пустым именем конфигуратор откажется работать, и причина будет выглядеть загадочно. После правки программа умеет проверить себя сама и сказать, чего ей не хватает.

Две вещи назовём честно. Первая: чтобы правки возвращались по одному объекту, конфигурация должна быть доступна для изменения — на этом стенде мы сняли её с поддержки. На боевой базе это решение принимают не на демонстрации.

Вторая: ЕРП в разы больше этой базы. Первая раскладка там займёт заметно дольше, и мы её пока не мерили.
"""
buttons = ["Готово"]
advance_on = "button"
[step.target]
kind = "none"
[step.actions]
"Готово" = "close"
