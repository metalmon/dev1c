# Один компилятор на всех: на машине разработчика, в хуке `pre-push` и в CI.
#
# Пин поставлен не из любви к порядку. `dtolnay/rust-toolchain@stable` в
# `build.yml` берёт «последний стабильный на момент запуска», и 26.10.2026 два
# задания ОДНОГО прогона собрались разными компиляторами: `rustc 1.99.0` на
# windows-latest и `1.99.1` на ubuntu-24.04, — а на машине владельца стоял
# 1.98.1. Шаг «Lint» гоняет clippy с `-D warnings`, и новая версия приносит
# новые замечания: без пина вышедший ночью Rust роняет пуш, чистый локально,
# без единой правки в коде.
#
# Файл лежит в корне, а не рядом с `setup/Cargo.toml`: rustup ищет его в
# текущем каталоге и выше, а cargo здесь зовут и из корня (`--manifest-path
# setup/Cargo.toml`, как в CI), и из `setup/` (так делает хук). Корень
# покрывает оба случая.
#
# Цена: Rust больше не обновляется сам. Обновление — отдельный коммит, где
# версия поднимается здесь и тут же прогоняются
#     cargo clippy --workspace --all-targets --features dev1c-setup/gui -- -D warnings
#     cargo test --workspace --features dev1c-setup/gui
# потому что новые замечания приходят вместе с версией, и разбирать их надо
# в том же коммите, а не обнаруживать потом на чужом пуше.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
