name: build image

# Why CI at all: the build needs about 4 GB of RAM and 10 GB of disk, which a
# working laptop does not always have free — llama.cpp alone unpacks 731 MB of
# CUDA. A runner has both, and the result comes back as a downloadable file.
#
# No GPU is involved: the CUDA runtime is only unpacked as files.

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open an SSH session to the runner after the job"
        type: boolean
        default: false
      binaries_only:
        description: "Build and test the setup binaries only, skip the image"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - config/**
      - .dockerignore
      - .github/workflows/build.yml
      - setup/**

jobs:
  setup:
    # The installers. Built here, not on the laptop: this is where the memory
    # is, and the result lands next to the image as an artifact.
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            bin: dev1c-setup
          - os: windows-latest
            name: windows
            bin: dev1c-setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: setup
      # 1c-connect is built with its window on both systems: on Windows for
      # the developer's kit, on Linux for the image with the platform inside,
      # where it runs in local mode with a tray icon in the XFCE panel. GPUI
      # and tray-icon need the libraries below; the panel speaks
      # StatusNotifier, which is libayatana-appindicator on the runtime side.
      # dev1c-setup stays a CLI on Linux — its window (GPUI since 2026-10-19,
      # Tauri before that) is never opened on a server.
      - name: Libraries for the Linux window
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libgtk-3-dev libayatana-appindicator3-dev             libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev             libx11-dev libxcb1-dev libvulkan-dev libfontconfig-dev libasound2-dev
      - name: Test
        run: cargo test --workspace --manifest-path setup/Cargo.toml ${{ matrix.name == 'linux' && '--no-default-features' || '' }}
      - name: Build
        run: |
          cargo build --release --manifest-path setup/Cargo.toml -p dev1c-setup ${{ matrix.name == 'linux' && '--no-default-features' || '' }}
          cargo build --release --manifest-path setup/Cargo.toml -p onec-connect
      - uses: actions/upload-artifact@v4
        with:
          name: dev1c-setup-${{ matrix.name }}
          path: setup/target/release/${{ matrix.bin }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: 1c-connect-${{ matrix.name }}
          path: setup/target/release/1c-connect${{ matrix.name == 'windows' && '.exe' || '' }}
          if-no-files-found: error
      - name: Build the live tunnel test as a standalone binary
        # The image job runs it against the container it installs; that job
        # carries no Rust toolchain of its own.
        if: matrix.name == 'linux'
        run: |
          bin=$(cargo test --manifest-path setup/Cargo.toml -p onec-connect --no-default-features --test tunnel_live --no-run 2>&1 \
                | grep -oE 'setup/target/debug/deps/tunnel_live-[0-9a-f]+' | head -1)
          test -n "$bin" && cp "$bin" tunnel_live && ls -la tunnel_live
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux'
        with:
          name: tunnel-live-linux
          path: tunnel_live
          if-no-files-found: error

  build:
    needs: setup
    # A manual run for the installers alone (a window change, say) does not
    # need the 3 GB image rebuilt.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.binaries_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Nothing here writes to the repository: the build reads sources and the
    # result leaves as an artifact. Default permissions are wider than that.
    permissions:
      contents: read
      # The model-server image dev1c-llama (built separately by llama.yml) is
      # pulled from the registry and packed next to the environment image.
      # Private by default, so the job needs to read packages.
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          # No pushing from here, so the token has no business staying in
          # .git/config — where any build step could read it.
          persist-credentials: false

      - name: Free up disk space
        # A stock runner keeps ~14 GB free on /, and the image plus its layers
        # need more than that. These preinstalled toolchains are of no use here
        # and give back about 20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Log in to the registry
        # Needed to pull the model-server image dev1c-llama
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Room to breathe
        # Exporting a 3 GB image leaves dockerd holding most of the runner's
        # 16 GB, and the runner then kills whatever runs next (exit 143) —
        # the build itself at "exporting layers" on a bad day. The runner's
        # own 3 GB of swap was full every time it happened. Disk is plentiful.
        run: |
          # /swapfile is the runner's own, in use; ours goes next to it. Each
          # command on its own line so a failure stops the step (set -e).
          sudo fallocate -l 8G /swap-dev1c
          sudo chmod 600 /swap-dev1c
          sudo mkswap /swap-dev1c >/dev/null
          sudo swapon /swap-dev1c
          free -m | grep -E 'Mem|Swap'

      - name: Lint Dockerfile
        run: docker build --check .

      - name: Build
        run: |
          # --provenance/--sbom off: a modern BuildKit attaches attestation
          # manifests by default, and Docker 20.10.24 on the customer's
          # server refuses to load an archive that carries one.
          docker build --provenance=false --sbom=false -t oktaplus/dev1c:latest .
          echo "== memory after the build"; free -m | grep -E 'Mem|Swap'
          # dockerd keeps ~14 GB resident after exporting this image (84 % of
          # the runner) and everything after it runs from swap or gets killed.
          # The image is on disk; the daemon's memory is not needed again.
          sudo systemctl restart docker
          docker image inspect oktaplus/dev1c:latest --format 'image still here: {{.Id}}'
          echo "== memory after restarting docker"; free -m | grep -E 'Mem|Swap'

      # --- Checks ------------------------------------------------------------
      # The point of these is that nobody has to start the environment by hand to
      # learn that a service does not come up or that a placeholder was never
      # substituted. Both failures are silent: the environment looks fine and the
      # agent simply has no model.

      - uses: actions/download-artifact@v4
        with:
          name: dev1c-setup-linux
          path: .

      - name: Install through dev1c-setup
        # The installer is the product: if it cannot bring the image up and
        # pass its own checks on a clean machine, nothing else matters. Remote
        # model: the local file path is not exercised here (the model is served
        # elsewhere for now). The image is already loaded under its tag, so the
        # kit needs no archive.
        run: |
          mkdir -p kit
          cat > kit/dev1c.toml <<'EOF'
          [server]
          gpu = false
          # The runner has 16 GB; a container allowed 24g took it all and the
          # runner killed whatever ran next. Cap it here, so a hog inside dies
          # inside (oom=true in the diagnostics) instead of taking the job.
          memory = "6g"
          [model]
          serve = "remote"
          url = "https://model.example.com/v1"
          key = "not-a-real-key"
          name = "some-model"
          EOF
          chmod +x dev1c-setup
          ./dev1c-setup --kit kit install --dry-run
          ./dev1c-setup --kit kit install -y
          ./dev1c-setup --kit kit status
          cat kit/last-check.txt

      - uses: actions/download-artifact@v4
        with:
          name: tunnel-live-linux
          path: .

      - name: The tunnel from a developer's machine reaches the container
        # The real sshd, the real PermitListen, the real nc behind Zed's
        # settings: 1c-connect's live test (same code as the Windows build,
        # built by the setup job) forwards 7771 and asserts that
        # `nc -z localhost 7771` succeeds inside the container. The bridge
        # behind it is not exercised here — there is no 1C on a runner.
        run: |
          chmod +x tunnel_live
          # The tunnel comes in as workstation dev1 (password = login).
          DEV1C_SSH=127.0.0.1:3393 DEV1C_SSH_PASSWORD=dev1 DEV1C_DOCKER=1 ./tunnel_live --nocapture

      - name: Variables reach the sessions, placeholders are gone
        run: |
          docker exec dev1c grep -q 'CUSTOM_API_URL=' /etc/environment && echo "ok: variables carried into /etc/environment"
          docker exec dev1c grep -q '"provider": "custom"' /home/dev1/.config/zed/settings.json && echo "ok: provider switched to custom"
          ! docker exec dev1c grep -q 'PLACEHOLDER"' /home/dev1/.config/zed/settings.json || { echo "FAIL: placeholder left"; exit 1; }

      - name: 1C tooling works
        run: |
          docker exec dev1c oscript -version
          docker exec dev1c sh -c 'printf "Сообщить(\"ok: \" + (2+2));" > /tmp/t.os && oscript /tmp/t.os'
          docker exec dev1c /opt/bsl-analyzer/bsl-analyzer --version
          docker exec dev1c sh -c 'command -v nc'
          docker exec dev1c sh /usr/local/bin/test-entrypoint-ports
          docker exec dev1c tea --version | head -1
          docker exec dev1c sh -c 'ls /home/dev1/.agents/skills | wc -l | xargs echo "skills:"'
          docker exec dev1c test -s /home/dev1/.config/zed/AGENTS.md \
            && echo "ok: agent rules in place"
          # The developers' organisation and git without prompts for every workstation.
          docker exec dev1c sh -c 'curl -sf http://localhost:3000/api/v1/orgs/dev1c | grep -q "\"username\":\"dev1c\""' \
            && echo "ok: organisation dev1c"
          docker exec dev1c sh -c 'test -s /home/dev1/.git-credentials && test "$(stat -c %a /home/dev1/.git-credentials)" = 600' \
            && echo "ok: git credentials for dev1"
          # Push-to-create as a non-admin owner: the first project_push does exactly this.
          docker exec -u dev2 dev1c sh -c 'cd "$(mktemp -d)" && git init -q -b dev2 && echo x > f && git add f && git commit -qm x && git push -q http://localhost:3000/dev1c/ci-probe.git dev2' \
            && docker exec dev1c sh -c 'curl -sf -u dev2:dev2 http://localhost:3000/api/v1/repos/dev1c/ci-probe >/dev/null' \
            && echo "ok: push-to-create in the organisation as dev2"

      - uses: actions/download-artifact@v4
        with:
          name: dev1c-setup-windows
          path: bins
      - uses: actions/download-artifact@v4
        with:
          name: 1c-connect-windows
          path: bins

      - name: Pack
        # gzip -1: the layers are already compressed, so a higher level costs
        # minutes and saves almost nothing. pack.sh then lays out the two kits
        # from the archive and the two installer binaries.
        run: |
          # Both images in one archive: the environment and the model server
          # for serve = "docker" (same llama.cpp build as the host row in pack.sh).
          docker pull ghcr.io/metalmon/dev1c-llama:b11734
          docker tag ghcr.io/metalmon/dev1c-llama:b11734 oktaplus/dev1c-llama:latest
          docker save oktaplus/dev1c:latest oktaplus/dev1c-llama:latest | gzip -1 > dev1c-image.tar.gz
          ls -lh dev1c-image.tar.gz
          # The customer's server runs Docker 20.10.24, which refuses an
          # archive carrying an attestation manifest. Fail here, not there.
          sh scripts/check-image-archive.sh dev1c-image.tar.gz
          docker image inspect oktaplus/dev1c:latest \
            --format 'image size: {{.Size}} bytes'
          cp dev1c-setup bins/
          # --llama windows adds the model server row (about 550 MB) and nssm.
          ./pack.sh --llama windows dev1c-image.tar.gz bins
          ls -la dist/dev1c-kit dist/1c-connect

      - name: Fetch the NVIDIA Container Toolkit .deb files
        # The pilot server (Task 5) has no internet, so these four packages
        # travel in the Linux kit instead of being apt-installed there.
        # Fetched once, here; pack.sh (sha_of) only verifies and copies, so a
        # moved or swapped file fails the build instead of reaching a kit.
        run: |
          mkdir -p nvidia-container-toolkit
          base=https://nvidia.github.io/libnvidia-container/stable/deb/amd64
          ver=1.20.1-1
          for pkg in nvidia-container-toolkit nvidia-container-toolkit-base libnvidia-container1 libnvidia-container-tools; do
            curl -fsSL -o "nvidia-container-toolkit/${pkg}_${ver}_amd64.deb" "$base/${pkg}_${ver}_amd64.deb"
          done
          ls -la nvidia-container-toolkit

      - name: Pack the Linux kit
        # The headless Ubuntu pilot: serve = "docker" only, so no llama row
        # and no nssm (--os linux in pack.sh); same image archive as above.
        run: |
          ./pack.sh --os linux dev1c-image.tar.gz bins
          ls -la dist/dev1c-kit-linux

      - name: Install from the Linux kit, container form (two barriers, same binary)
        # A second install, deliberately — not a rework of "Install through
        # dev1c-setup" above. That step installs through the Linux *binary*
        # before the Linux *kit* exists (the kit is only packed just above)
        # and everything downstream of it (the tunnel, the sessions'
        # variables, 1C tooling) exercises the container it brought up;
        # pointing it at the kit instead would break that run. This one
        # installs from the actual packed kit with serve = "docker" (the
        # model server as a second container, not a service on the host).
        #
        # --dry-run only, never -y: state() alone is enough to prove either
        # barrier (run.rs calls it unconditionally; dry_run only skips
        # apply(), and the "пропущено: …" line prints the same in both
        # modes). A real install IS feasible here — Env::apply's port probe
        # only runs when the container isn't already "ours" and running
        # (ops.rs:189,194), and it is, left up by the earlier install step,
        # so there is no port collision; Services' 120 s wait would in fact
        # pass in seconds against that same still-running "dev1c"
        # (ops.rs:487). The reason to stay with --dry-run is different: a
        # real run would silently ride on the container the earlier step
        # left running instead of building one from this kit, so it would
        # prove nothing about the Linux kit at all.
        #
        # Two assertions, two states, both from the same binary:
        #  1. the kit exactly as shipped — [model] file empty, nobody has
        #     supplied a .gguf yet — stops at "модель не выбрана"
        #     (ops.rs::Model / ops_llama.rs::Container, both gate on this
        #     before anything Docker- or GPU-shaped). This is the gate every
        #     real administrator hits first, and the more valuable of the
        #     two: it is what the customer will actually see.
        #  2. with a placeholder name in [model] file (ops_llama's own file
        #     check is a string check, not a stat — no file needs to exist
        #     for a dry run), the installer walks past that gate and proves
        #     the one thing a GPU-less runner honestly can beyond it: the
        #     video-card barrier, named in Russian. The kit's real
        #     dev1c.toml is restored before the upload-artifact step below
        #     so the uploaded kit stays the honest one.
        run: |
          chmod +x dist/dev1c-kit-linux/dev1c-setup
          ./dist/dev1c-kit-linux/dev1c-setup --kit dist/dev1c-kit-linux install --dry-run | tee install-linux-kit-untouched.log
          grep -qF 'модель не выбрана: [model] file — файл в комплекте' install-linux-kit-untouched.log

          cp dist/dev1c-kit-linux/dev1c.toml dist/dev1c-kit-linux/dev1c.toml.orig
          sed -i 's/^file = ""$/file = "placeholder.gguf"/' dist/dev1c-kit-linux/dev1c.toml
          grep '^file = ' dist/dev1c-kit-linux/dev1c.toml
          ./dist/dev1c-kit-linux/dev1c-setup --kit dist/dev1c-kit-linux install --dry-run | tee install-linux-kit.log
          mv dist/dev1c-kit-linux/dev1c.toml.orig dist/dev1c-kit-linux/dev1c.toml
          grep -qF 'Драйвер NVIDIA на сервере не отвечает (nvidia-smi молчит)' install-linux-kit.log

          if grep -q '^docker:' install-linux-kit-untouched.log install-linux-kit.log; then
            echo "FAIL: a raw docker: error leaked into the log" >&2
            exit 1
          fi

      - name: Layer sizes
        # Printed on every build so growth is noticed when it happens, not when
        # somebody has to transfer the file. Note that `docker image inspect`
        # under Docker Desktop reports a compressed figure, while a plain dockerd
        # reports the unpacked one — compare like with like.
        run: |
          docker history oktaplus/dev1c:latest --format '{{.Size}}	{{.CreatedBy}}'             | sort -rh | head -8 | cut -c1-110

      - name: Verify no secrets in the image
        # The key is passed at run time and no build argument accepts it any
        # more, so this should hold forever. Checked anyway: it is the one thing
        # that must never leak into a file we hand over.
        run: |
          if docker image inspect oktaplus/dev1c:latest \
               --format '{{json .Config.Env}}' | grep -qi 'api_key'; then
            echo "A key ended up in the image environment" >&2
            exit 1
          fi
          echo "no keys in the image environment"

      - uses: actions/upload-artifact@v4
        with:
          name: dev1c-kit
          path: dist/
          retention-days: 14
          # The image inside is already a .gz — re-compressing wastes minutes
          compression-level: 0

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs dev1c 2>&1 | tail -50 || true
          cat kit/setup.log 2>/dev/null | tail -40 || true

      - name: Who killed the step (diagnostics on failure)
        # Steps have been dying with SIGTERM (exit 143) about 20 s after the
        # container starts, with no cancellation notice. The kernel log, the
        # system journal and docker's own events are where a reason would be.
        if: failure()
        run: |
          echo "== dmesg"; sudo dmesg 2>/dev/null | tail -40 || true
          echo "== journal (last 3 min)"; sudo journalctl --no-pager --since "-3min" 2>/dev/null | grep -v -E 'audit|pam_unix' | tail -80 || true
          echo "== docker events (last 3 min)"; docker events --since 3m --until 0s 2>/dev/null | tail -40 || true
          echo "== memory"; free -m; echo "== disk"; df -h / | tail -1
          echo "== biggest processes on the runner"; ps aux --sort=-rss | head -12 | cut -c1-160
          echo "== container"; docker inspect dev1c --format '{{.State.Status}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' 2>/dev/null || true
          docker stats --no-stream 2>/dev/null || true
          echo "== processes in the container"; docker top dev1c -o pid,rss,args 2>/dev/null | sort -k2 -rn | head -12 | cut -c1-160 || true

      - name: SSH session to the runner
        # For hands-on debugging when the local machine has no memory to spare.
        # The URL to connect appears in this step's log; the job then waits until
        # you disconnect or the 60-minute timeout hits.
        #
        # Only on an explicit request, never automatically on failure: an
        # unattended failed build would otherwise hold a runner for an hour
        # waiting for somebody who is not coming.
        #
        # Pinned to a commit, not to a tag: a third-party action in a public
        # repository is supply chain, and a tag can be moved to different code
        # at any time. Re-pin deliberately when updating.
        if: github.event_name == 'workflow_dispatch' && inputs.debug
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true
