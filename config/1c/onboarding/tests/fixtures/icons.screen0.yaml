# Раскладка значков рабочего стола xfdesktop, снятая со стенда (screen0).
# Пока xfdesktop запущен, файл доступен только на чтение — отсюда его
# читают, в него не пишут. Запись устарела, если называемого файла уже нет
# на диске (см. 1c-enterprise.desktop и 1c-configurator.desktop ниже) —
# desktop_icon() должен такие записи отбрасывать, а не угадывать позицию.
monitors:
  - name: monitor0
    geometry:
      width: 2560
      height: 1440
icons:
  - uri: file:///home/dev1
    row: 0
    col: 0
  - uri: file:///home/dev1/Desktop/1c-enterprise.desktop
    row: 1
    col: 0
  - uri: file:///home/dev1/Desktop/1c-start.desktop
    row: 1
    col: 0
  - uri: file:///home/dev1/Desktop/dev.zed.Zed.desktop
    row: 2
    col: 0
  - uri: file:///home/dev1/Desktop/gitea.desktop
    row: 3
    col: 0
  - uri: file:///home/dev1/Desktop/1c-configurator.desktop
    row: 4
    col: 0
