# Среда разработки 1С — параметры комплекта.
# Правится только этот файл; всё остальное программа выводит из него.
# После правки: dev1c-setup change   (применит только то, что разошлось)

[server]
# Имя контейнера и приставка его томов. Менять незачем, если на машине одна среда.
name = "dev1c"
# Первый из четырёх портов подряд: RDP, Gitea, сервер модели, SSH для туннеля.
# Заняты? Поставьте, например, 4000 — тогда блок 4000–4003.
port = 3390
# Предел памяти контейнера среды. Веса модели живут на видеокарте, но при
# serve = "docker" сервер модели стоит на этой же машине, и ему нужна
# оперативная память под кэш подсказок: оставьте ему больше половины
# (образец для docker так и делает — 8g среде, остальное [model] memory).
memory = "24g"
# true — отдать контейнеру среды видеокарту (аппаратный рендер в сессии).
# Серверу модели это не нужно: он работает отдельно, см. [model].
gpu = false
# "docker" или "podman".
engine = "docker"

[model]
# Как подаётся модель для агентов:
#   "host"   — llama-server службой на этой машине (Windows: nssm из комплекта,
#              Linux: systemd); модель — файл на диске этой машины. Умолчание.
#   "docker" — контейнер рядом со средой из образа комплекта; модель — файл
#              в комплекте, копируется в том <имя>-models.
#   "remote" — чужой OpenAI-совместимый сервер: url, key, name ниже.
serve = "host"
# host: полный путь к .gguf на этой машине — в одинарных кавычках, чтобы не
# удваивать косые: file = 'C:\models\Qwen3.5-4B.Q4_K_M.gguf'
# docker: путь к файлу относительно комплекта. Пусто — модель ещё не выбрана.
file = ""
# remote: адрес с путём, но без завершающего /chat/completions — его добавляет редактор.
url = ""
# remote: ключ доступа. Может быть пустым.
key = ""
# Имя модели: remote — ровно так, как сервер его называет; host/docker — любое,
# пусто — имя файла без расширения.
name = ""
# host: порт службы на этой машине (слушает только петлю).
port = 1235
# docker: предел памяти контейнера модели — например "22g". Пусто — посчитать
# от машины: всего − предел контейнера среды − 2 ГБ хосту. Там же живёт кэш
# подсказок (половина предела, не больше 8 ГБ), и подкачке разрешено вдвое.
memory = ""
# На сколько агентов делить окно ОДНОГО слота. 1 — не делить: у каждого
# рабочего места свой слот, деление нужно, если один человек гоняет
# несколько агентов разом.
agents = 1
# Сколько мест (слотов) держит сервер модели: по одному на рабочее место.
# Меньше трёх ставят, когда карта не вмещает три окна рядом с весами модели:
# веса едут на карту первыми и целиком, кэш окна — по остаточному, и если
# кэш на карте не поместится, счёт уйдёт на процессор (замер на 8 ГБ:
# 6 токенов в секунду вместо 89).
slots = 3
# Окно в токенах НА СЛОТ. Серверу уходит умноженным на slots — это его
# единица измерения, обратно он делит сам. Редактору ничего не объявляется:
# штатный провайдер Zed забирает окно с `/props` сам. Проверка одна — окно на
# агента (окно ÷ agents) не меньше 24576 токенов: 16384 на вход и 8192 на
# ответ.
fit_ctx = 65536
