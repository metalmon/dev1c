[package]
name = "dev1c-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Установка среды разработки 1С: один файл вместо скриптов"

# Окно входит в сборку по умолчанию: двойной щелчок по файлу из комплекта
# обязан его открыть. Linux-сборка в CI идёт без него (--no-default-features).
[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build"]

[dependencies]
common = { path = "../common" }
tauri = { version = "2", features = ["image-png"], optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Проверки по HTTP (Gitea отвечает?). Системное доверие на Windows, rustls с
# системными корнями на Linux — так бинарь собирается статически.
[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "native-tls"]

[target.'cfg(unix)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls-native-roots"]

[build-dependencies]
tauri-build = { version = "2", optional = true }
