[package]
name = "dev1c-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Установка среды разработки 1С: один файл вместо скриптов"

# Окна у этой программы нет (снято 12.11). Оно жило за флагом `gui`,
# выключенным по умолчанию с 2026-10-25, и в поставку не уходило ни разу:
# оконная сборка на Windows помечается windows_subsystem = "windows", а такую
# программу PowerShell не ждёт — печатает приглашение сразу, вывод установки
# лезет поверх него, и код возврата до скрипта не доходит. Отложенный код
# стареет молча, а git его помнит.

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Проверки по HTTP (Gitea отвечает?). Системное доверие на Windows, rustls с
# системными корнями на Linux — так бинарь собирается статически.
[target.'cfg(windows)'.dependencies]
# Win32_System_SystemInformation — местное время для заголовков журнала окна.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "native-tls"]

[target.'cfg(unix)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls-native-roots"]

# Не optional и не за флагом `gui`: значок нужен и консольной сборке.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
