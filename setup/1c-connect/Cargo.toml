# Cargo refuses a package name that starts with a digit; the binary may be
# called 1c-connect, the package is onec-connect and the library one_c_connect.
[package]
name = "onec-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Подключение машины с 1С к среде разработки: туннель и мост к mcp-1c"

[lib]
name = "one_c_connect"
path = "src/lib.rs"

[[bin]]
name = "1c-connect"
path = "src/main.rs"

# Окно входит в сборку по умолчанию: двойной щелчок по файлу из комплекта
# обязан его открыть. На Linux оно тоже собирается — образ со стендом
# запускает программу в локальном режиме со значком в трее XFCE; без окна
# (`--no-default-features`) там остаётся только CLI для живого теста туннеля.
[features]
default = ["gui"]
gui = ["common/gui", "dep:gpui-kit", "dep:tray-icon", "dep:futures", "dep:image", "dep:embed-resource", "dep:raw-window-handle", "dep:gtk", "dep:x11rb"]

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
gpui-kit = { version = "=0.7.3", optional = true }
tray-icon = { version = "=0.26.1", default-features = false, optional = true }
futures = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# The SSH client is embedded: ssh.exe is an optional Windows component with
# behaviour that differs by version, and it takes the password only from a
# keyboard. ring, not aws-lc-rs: no cmake/nasm needed on a Windows build box.
russh = { version = "0.64", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Трею нужен инициализированный GTK и прокрутка его цикла (`tray::init`,
# `tray::pump`). Крейт всё равно приходит с libappindicator, здесь он нужен
# по имени; на других системах его нет вовсе.
gtk = { version = "0.18", optional = true }
# Значку в трее на Linux нужен бэкенд, иначе `tray-icon` отказывается
# собираться: «either the `libappindicator` or `ksni` feature must be enabled».
# Было `libappindicator`: панель XFCE показывает его элементы, но сам бэкенд
# не сообщает о щелчке по значку вовсе — левая кнопка там открывала то же
# меню, что и правая, и достать окно можно было только пунктом «Открыть окно».
# `ksni` — тот же StatusNotifierItem через D-Bus — отдаёт настоящую активацию
# (`TrayIconEvent::Click`, `MouseButton::Left`/`Up`), которую `tray::on_tray`
# уже умеет разбирать (тот же код, что на Windows). Меню — всё равно через
# `muda`/GTK (у него свой дефолт `gtk3`, от бэкенда значка не зависит), так
# что `gtk::init()`/`tray::pump` выше остаются. Пункт «Открыть окно» в меню не
# снят: если панель когда-нибудь не отдаст активацию, это единственный путь к
# окну.
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"], optional = true }
# Рабочая область без панели (`_NET_WORKAREA`, `gui::window::work_area`) —
# своё, короткоживущее X11-соединение только на этот запрос. Версия та же,
# что уже разрешена транзитивно через gpui (`x11rb-xcb`/`x11rb-client` там, у
# нас нужны только базовые xproto-запросы без лишних фич) — новой зависимости
# в дереве сборки это не добавляет.
x11rb = { version = "=0.13.2", optional = true }
# Ради идентификатора окна X11: `gui::window::move_to` двигает флайаут сам
# (оконный менеджер за нас этого не делает), а номер окна отдаёт только
# дескриптор от GPUI. Крейт уже в дереве сборки — он есть у gpui, — и ниже
# тот же крейт объявлен для Windows ради HWND.
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
# Ради HWND окна: GPUI реализует `HasWindowHandle`, но сам типаж наружу не
# отдаёт. Новой сборки крейт не добавляет — он уже в зависимостях gpui.
raw-window-handle = { version = "0.6", optional = true }
# Список процессов платформы (`bridge::configurator_count`) без подпроцесса:
# полный `tasklist` стоил 330–510 мс (замер ревью), а спрашивается это на
# каждом такте. Крейт уже в `Cargo.lock` — скачивать нечего. Фича одна,
# «system»: нужны процессы, не диски и не сеть.
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
windows-sys ={ version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "native-tls"]

[target.'cfg(unix)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls-native-roots"]

[target.'cfg(unix)'.dependencies]
# Убийство группы процессов: SIGTERM, через 5 с SIGKILL. libc уже в Cargo.lock
# (его тянет tokio), прямая зависимость ничего не докачивает.
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
embed-resource = { version = "3", optional = true }
