[package]
name = "dev1c-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Установка среды разработки 1С: один файл вместо скриптов"

# Окно выключено по умолчанию (решение заказчика 2026-10-25). Причина не в
# самом окне: оконная сборка на Windows помечена windows_subsystem =
# "windows", а такую программу PowerShell не ждёт — печатает приглашение
# сразу, вывод установки лезет поверх него, и код возврата до скрипта не
# доходит. Собранная без окна программа — обычная консольная: ждут, код
# возврата отдаётся, вывод не перемешивается.
#
# Окно остаётся в коде за этим флагом: `--features gui`. Вернуть его в
# поставку можно, когда двойной щелчок будет решаться не подсистемой
# «windows», а прятанием своей консоли при запуске из проводника.
[features]
default = []
gui = ["common/gui", "dep:gpui-kit", "dep:futures", "dep:image"]

[dependencies]
common = { path = "../common" }
gpui-kit = { version = "=0.7.3", optional = true }
futures = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Проверки по HTTP (Gitea отвечает?). Системное доверие на Windows, rustls с
# системными корнями на Linux — так бинарь собирается статически.
[target.'cfg(windows)'.dependencies]
# Win32_System_SystemInformation — местное время для заголовков журнала окна.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "native-tls"]

[target.'cfg(unix)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls-native-roots"]

# Не optional и не за флагом `gui`: значок нужен и консольной сборке.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
