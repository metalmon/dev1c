# Среда разработки 1С — параметры комплекта.
# Правится только этот файл; всё остальное программа выводит из него.
# После правки: dev1c-setup change   (применит только то, что разошлось)

[server]
# Имя контейнера и приставка его томов. Менять незачем, если на машине одна среда.
name = "dev1c"
# Первый из четырёх портов подряд: RDP, Gitea, сервер модели, SSH для туннеля.
# Заняты? Поставьте, например, 4000 — тогда блок 4000–4003.
port = 3390
# Предел памяти контейнера. Локальная модель живёт на видеокарте, не здесь.
memory = "24g"
# false, если видеокарты нет: модель тогда считается на процессоре, медленно.
gpu = true
# "docker" или "podman".
engine = "docker"

[model]
# Файл модели относительно комплекта. Пусто — модель на удалённом сервере, см. ниже.
file = ""
# Удалённый OpenAI-совместимый сервер вместо файла: адрес с путём, но без
# завершающего /chat/completions — его добавляет редактор.
url = ""
# Ключ доступа к этому серверу.
key = ""
# Имя модели ровно так, как сервер его называет, например Qwen3.6-35B-A3B-AWQ.
name = ""
