# Тема для GTK-приложений.
#
# Зачем отдельно от xsettings.xml: XSETTINGS (xfsettingsd) управляет только
# GTK3. Приложения на GTK4/libadwaita его не слушают и берут светлость из
# собственных настроек — отсюда смешение светлых и тёмных окон на одном
# рабочем столе. Этот файл кладётся и в gtk-3.0, и в gtk-4.0.
[Settings]
gtk-theme-name=Materia-dark
gtk-icon-theme-name=Papirus-Light
gtk-font-name=Inter 10
gtk-button-images=0
gtk-menu-images=0
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
# Главное: явный запрет тёмного варианта. Без него часть приложений
# самостоятельно решает оформиться тёмными.
gtk-application-prefer-dark-theme=1
# Субпиксельное сглаживание по RDP даёт цветную бахрому на тексте
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
gtk-enable-animations=0
gtk-decoration-layout=menu:minimize,maximize,close
