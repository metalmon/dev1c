# Cargo refuses a package name that starts with a digit; the binary may be
# called 1c-connect, the package is onec-connect and the library one_c_connect.
[package]
name = "onec-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Подключение машины с 1С к среде разработки: туннель и мост к mcp-1c"

[lib]
name = "one_c_connect"
path = "src/lib.rs"

[[bin]]
name = "1c-connect"
path = "src/main.rs"

# Окно входит в сборку по умолчанию: двойной щелчок по файлу из комплекта
# обязан его открыть. Linux-сборка для живого теста в CI идёт без него
# (--no-default-features), чтобы не ставить на раннер webkit2gtk.
[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tauri = { version = "2", features = ["image-png", "tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
# The SSH client is embedded: ssh.exe is an optional Windows component with
# behaviour that differs by version, and it takes the password only from a
# keyboard. ring, not aws-lc-rs: no cmake/nasm needed on a Windows build box.
russh = { version = "0.64", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "native-tls"]

[target.'cfg(unix)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls-native-roots"]

[build-dependencies]
tauri-build = { version = "2", optional = true }
