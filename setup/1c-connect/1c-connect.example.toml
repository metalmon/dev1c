# Подключение машины с 1С к среде разработки. Лежит рядом с 1c-connect.exe.
# Правится только этот файл. После правки: 1c-connect check

[host]
# Адрес среды и её SSH-порт — печатает dev1c-setup install на сервере.
server = ""
# Адрес Gitea среды целиком, со схемой и портом (например http://localhost:3000
# — так Gitea видна изнутри образа среды). Пусто — адрес не задан, и программа
# его не выдумывает: в режиме "tunnel" его записывает 1c-connect install (тот же
# хост, порт на два ниже SSH), в образе — seed стенда. В режиме "local" поле не
# нужно вовсе: среды нет, а origin проекта — ваш собственный, какой вы завели
# обычным git.
gitea = ""
# Пароль вашего рабочего места в среде (в пилоте равен логину).
password = ""
# Ваш логин в среде: dev1, dev2 или dev3. От него зависят порты туннеля.
workstation = ""
# Режим работы. "local" — всё на одной машине: база, агенты, мост и проект;
# никакой среды нет, и три поля выше остаются пустыми. Это умолчание: человек,
# который поставил коннектор рядом со своей 1С, ничего здесь не правит.
# "tunnel" — база на этой машине, а агент на удалённой стороне, в контейнере
# среды, и туда идёт туннель; тогда три поля выше про неё и обязательны.
# Руками это поле править не нужно: его пишет подменю «Режим работы» в меню
# значка программы.
mode = "local"

# Путь к файловой базе, либо сервер\база для клиент-серверной.
base_path = ""
# Версия платформы 1С или её маска ("8.3"), если на машине их несколько.
# Пусто — коннектор выбирает так же, как 1С: пин базы в ibases.v8i, затем
# DefaultVersion в 1CEStart.cfg, затем самая новая установленная.
# Названная здесь версия, которой на машине нет, — отказ со словами, а не
# тихий переход на другую.
# platform = "8.3.27"
# Вид конфигурации базы для mcp-1c: "generic" или "buh_3_0" (Бухгалтерия
# 3.0). Пусто — "auto": mcp-1c сам определяет вид по составу конфигурации.
configuration = ""
# Пользователь базы с правами администратора — для установки расширения и
# для HTTP-сервиса; пароль может быть пустым.
db_user = ""
db_password = ""
# Кто публикует базу: "auto" — сама программа своим веб-сервером, адрес
# считается (см. http_port ниже); "webserver" — база уже опубликована вручную
# на Apache или IIS, адрес берётся из base_url ниже.
# Руками это поле править не нужно: его пишет подменю «Публикация базы» в
# меню значка программы — правая кнопка по значку в трее, «Публикует
# коннектор» или «Публикует платформа 1С».
# Если база уже опубликована, человеку остаётся один щелчок в Конфигураторе:
# Публикация на веб-сервере → вкладка «HTTP-сервисы» → галочка «Публиковать
# HTTP-сервисы расширений по умолчанию». Без неё HTTP-сервис расширения не
# опубликован и отвечает 404. Перезапускать веб-сервер не нужно: дескриптор
# перечитывается на следующем же запросе (замер 27.10.2026).
publication = "auto"
# Порт своего веб-сервера в режиме "auto". 0 — считается как 8080 + номер
# рабочего места и записывается сюда при 1c-connect install.
http_port = 0
# Адрес опубликованной базы на этой машине (Конфигуратор → Администрирование →
# Публикация на веб-сервере). Используется только при publication =
# "webserver", и правят его в окне: на «Параметрах» в этом режиме появляется
# поле «Адрес публикации». Вписывают туда адрес так, как открывают базу в
# браузере (http://localhost/Buh) — хвост /hs/mcp-1c программа дописывает
# сама. Пусто значит «не задан»: включать в этом режиме нечего, и
# переключатель заперт, пока адрес не вписан и не сохранён.
base_url = ""
# Каталог выгрузки для поиска по коду. Пусто — <project>\src; это значение
# записывается сюда при 1c-connect install. Записанное умолчание продолжает
# идти за каталогом проекта, а вписанный свой каталог смену project переживает.
dump = ""
# Каталог проекта на этой машине: сюда ложатся исходники (src), здесь живёт
# git. Создаётся при install. Не каталог базы.
project = ""
# Инструменты vrunner, которые видит агент. Полный список — vrunner-mcp,
# 61 инструмент; здесь рабочий набор.
tools = ["cf_decompile", "cf_load", "infobase_update", "validate_syntax_check", "test_xunit", "test_vanessa", "test_yaxunit", "task_status", "task_result", "task_cancel", "cache_show", "cache_clear"]
