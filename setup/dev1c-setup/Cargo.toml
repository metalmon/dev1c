[package]
name = "dev1c-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Установка среды разработки 1С: один файл вместо скриптов"

# Окно входит в сборку по умолчанию: двойной щелчок по файлу из комплекта
# обязан его открыть. Linux-сборка в CI идёт без него (--no-default-features).
[features]
default = ["gui"]
gui = ["common/gui", "dep:gpui-kit", "dep:futures", "dep:image", "dep:embed-resource"]

[dependencies]
common = { path = "../common" }
gpui-kit = { version = "=0.7.3", optional = true }
futures = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Проверки по HTTP (Gitea отвечает?). Системное доверие на Windows, rustls с
# системными корнями на Linux — так бинарь собирается статически.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "native-tls"]

[target.'cfg(unix)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls-native-roots"]

[target.'cfg(windows)'.build-dependencies]
embed-resource = { version = "3", optional = true }
