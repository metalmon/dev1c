# Подключение машины с 1С к среде разработки. Лежит рядом с 1c-connect.exe.
# Правится только этот файл. После правки: 1c-connect check

# Какое из соединений ниже работает прямо сейчас — имя одного из них. Руками
# это поле править не нужно: имя пишет сюда команда переключения
# (1c-connect use «имя»). Имя, которого среди соединений нет, — отказ со
# словами: лучше услышать про опечатку, чем молча работать не с той базой.
current = "Соединение 1"

# Дальше идут соединения — по блоку [[connection]] на каждую базу. Блоки
# устроены одинаково, поэтому поля объяснены здесь, один раз, а не повторены
# в каждом блоке. Нужна вторая база — скопируйте блок целиком, дайте ему
# другое имя и впишите свой путь к базе и свой каталог проекта.
#
# name — имя соединения: им оно названо в строке current выше и в команде
#     переключения (1c-connect use «имя»). У двух соединений одно имя быть не
#     может. В окне карточка подписана каталогом базы — это другое, и имя
#     отсюда там пока не показывается.
# server — адрес среды и её SSH-порт — печатает dev1c-setup install на
#     сервере.
# gitea — адрес Gitea среды целиком, со схемой и портом (например
#     http://localhost:3000 — так Gitea видна изнутри образа среды). Пусто —
#     адрес не задан, и программа его не выдумывает: в режиме "tunnel" его
#     записывает 1c-connect install (тот же хост, порт на два ниже SSH), в
#     образе — seed стенда. В режиме "local" поле не нужно вовсе: среды нет,
#     а origin проекта — ваш собственный, какой вы завели обычным git.
# password — пароль вашего рабочего места в среде (в пилоте равен логину).
#     Непустой хранится зашифрованным: что лежит в файле — не пароль, а
#     шифртекст с видимым префиксом, и вставлять его куда-либо незачем.
# workstation — ваш логин в среде: dev1, dev2 или dev3. От него зависят
#     порты туннеля.
# mode — режим работы. "local" — всё на одной машине: база, агенты, мост и
#     проект; никакой среды нет, и три поля выше остаются пустыми. Это
#     умолчание: человек, который поставил коннектор рядом со своей 1С,
#     ничего здесь не правит. "tunnel" — база на этой машине, а агент на
#     удалённой стороне, в контейнере среды, и туда идёт туннель; тогда три
#     поля выше про неё и обязательны. Руками это поле править не нужно: его
#     пишет подменю «Режим работы» в меню значка программы.
# base_path — путь к файловой базе, либо сервер\база для клиент-серверной.
# base_here — где стоит сама база: true — на этой машине (так и бывает
#     почти всегда), false — на той стороне соединения. Умолчание — true.
# role — роль соединения: "accept" — эта машина принимает подключения,
#     "dial" — эта машина подключается сама. Умолчание — "accept": машина,
#     у которой код просят, встречается чаще, чем та, которая его вставляет.
# platform — версия платформы 1С или её маска ("8.3"), если на машине их
#     несколько. Пусто — коннектор выбирает так же, как 1С: пин базы в
#     ibases.v8i, затем DefaultVersion в 1CEStart.cfg, затем самая новая
#     установленная. Названная здесь версия, которой на машине нет, — отказ
#     со словами, а не тихий переход на другую.
# configuration — вид конфигурации базы для mcp-1c: "generic" или "buh_3_0"
#     (Бухгалтерия 3.0). Пусто — "auto": mcp-1c сам определяет вид по
#     составу конфигурации.
# profile — какой набор инструментов получает агент: "developer" или
#     "business" (словами контракта подключения — «Разработчик» или
#     «Бизнес-пользователь»). Пусто — "business": бухгалтеров больше, и им
#     опаснее получить разработческий набор по умолчанию.
# write — потолок записи у набора инструментов: "read_write" или
#     "read_only". Пусто — "read_only": пишущих в базу инструментов по
#     умолчанию нет. Руками это поле править не нужно: его пишет пункт
#     «Запись в базу» в меню значка программы.
# db_user и db_password — пользователь базы с правами администратора: для
#     установки расширения и для HTTP-сервиса. Пароль может быть пустым, а
#     непустой хранится зашифрованным, как и password выше.
# publication — кто публикует базу: "auto" — сама программа своим
#     веб-сервером, адрес считается (см. http_port ниже); "webserver" —
#     база уже опубликована вручную на Apache или IIS, адрес берётся из
#     base_url. Руками это поле править не нужно: его пишет подменю
#     «Публикация базы» в меню значка программы — правая кнопка по значку в
#     трее, «Публикует коннектор» или «Публикует платформа 1С».
#     Если база уже опубликована, человеку остаётся один щелчок в
#     Конфигураторе: Публикация на веб-сервере → вкладка «HTTP-сервисы» →
#     галочка «Публиковать HTTP-сервисы расширений по умолчанию». Без неё
#     HTTP-сервис расширения не опубликован и отвечает 404. Перезапускать
#     веб-сервер не нужно: дескриптор перечитывается на следующем же запросе
#     (замер 27.10.2026).
# http_port — порт своего веб-сервера в режиме "auto". 0 — считается как
#     8080 + номер рабочего места и записывается сюда при 1c-connect
#     install.
# base_url — адрес опубликованной базы на этой машине (Конфигуратор →
#     Администрирование → Публикация на веб-сервере). Используется только
#     при publication = "webserver", и правят его в окне: на «Параметрах» в
#     этом режиме появляется поле «Адрес публикации». Вписывают туда адрес
#     так, как открывают базу в браузере (http://localhost/Buh) — хвост
#     /hs/mcp-1c программа дописывает сама. Пусто значит «не задан»:
#     включать в этом режиме нечего, и переключатель заперт, пока адрес не
#     вписан и не сохранён.
# dump — каталог выгрузки для поиска по коду. Пусто — <project>\src; это
#     значение записывается сюда при 1c-connect install. Записанное
#     умолчание продолжает идти за каталогом проекта, а вписанный свой
#     каталог смену project переживает.
# project — каталог проекта на этой машине: сюда ложатся исходники (src),
#     здесь живёт git. Создаётся при install. Не каталог базы.
# tools — инструменты vrunner, которые видит агент. Полный список —
#     vrunner-mcp, 61 инструмент; здесь рабочий набор.

[[connection]]
name = "Соединение 1"
server = ""
gitea = ""
password = ""
workstation = ""
mode = "local"
base_path = ""
base_here = true
role = "accept"
platform = ""
configuration = ""
profile = ""
write = ""
db_user = ""
db_password = ""
publication = "auto"
http_port = 0
base_url = ""
dump = ""
project = ""
tools = ["cf_decompile", "cf_load", "infobase_update", "validate_syntax_check", "test_xunit", "test_vanessa", "test_yaxunit", "task_status", "task_result", "task_cancel", "cache_show", "cache_clear"]
